# /etc/nginx/sites-available/nexttradx
# Reverse-proxy in front of the Next.js container (which listens on 127.0.0.1:3000).
# Terminates TLS, forwards everything (pages + /api/*) to Next.js.

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;
    # Redirect all HTTP -> HTTPS (after certbot)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # certbot will fill these two lines in. Until then, comment out the
    # `listen 443 ssl` lines and only use the :80 block.
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    # Long timeouts so SSE / long-poll endpoints (if added later) stay open
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Next.js static assets — pass straight through with aggressive cache
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
